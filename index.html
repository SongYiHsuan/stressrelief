<body>
  <div id="app" class="loading">載入中...</div>

  <script>
    const LIFF_ID = '2010622307-PCCxkTmN';
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwYTYY4jmSekVKGpP1bboarpNgvLzxbMtSHPfyIySrjEte4RNFuAWERZkv3_2VWGQXHhw/exec';
    const STORE_NAME = '解憂藥局';

    const app = document.getElementById('app');

    const CACHE_KEY = 'stressrelief_member_cache_v2';

    function saveMemberCache() {
      try {
        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            member: state.member,
            activities: state.activities || [],
            coupons: state.coupons || [],
            couponUseLogs: state.couponUseLogs || [],
            walletLogs: state.walletLogs || [],
            savedAt: Date.now(),
          })
        );
      } catch (err) {
        console.warn('save cache failed', err);
      }
    }

    function readMemberCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;

        const data = JSON.parse(raw);

        if (!data || !data.member) return null;

        // 快取最多保留 12 小時
        if (Date.now() - Number(data.savedAt || 0) > 12 * 60 * 60 * 1000) {
          return null;
        }

        return data;
      } catch (err) {
        console.warn('read cache failed', err);
        return null;
      }
    }


    const state = {
      loading: true,
      error: '',
      idToken: '',
      profile: null,
      member: null,
      activities: [],
      coupons: [],
      couponUseLogs: [],
      walletLogs: [],
      tab: new URLSearchParams(window.location.search).get('tab') || 'coupon',
      view: 'home',
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }


    function encodeUrlValue(value) {
      return encodeURIComponent(String(value ?? ''));
    }

    function formatSimpleDateTime(value) {
      const raw = String(value ?? '').trim();

      if (!raw) return '';

      let d = null;

      // ISO 格式：2026-07-09T06:48:43.000Z
      if (raw.includes('T')) {
        const parsed = new Date(raw);

        if (!Number.isNaN(parsed.getTime())) {
          d = parsed;
        }
      }

      // 一般格式：2026/07/09 18:00:00 或 2026-07-09 18:00:00
      if (!d) {
        const normalized = raw.replace(/-/g, '/');
        const parsed = new Date(normalized);

        if (!Number.isNaN(parsed.getTime())) {
          d = parsed;
        }
      }

      if (!d) {
        return raw
          .replace(/-/g, '/')
          .replace('T', ' ')
          .replace('.000Z', '')
          .slice(0, 16);
      }

      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');

      return `${y}/${m}/${day} ${hh}:${mm}`;
    }

    function formatSimpleDate(value) {
      const text = formatSimpleDateTime(value);

      if (!text) return '';

      return text.split(' ')[0];
    }


    async function post(action, payload = {}) {
      if (!GAS_API_URL || GAS_API_URL.includes('你的')) {
        throw new Error('尚未設定 GAS_API_URL');
      }

      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify({
          action,
          ...payload,
        }),
      });

      const json = await res.json();

      if (!json.success) {
        throw new Error(json.message || 'API 發生錯誤');
      }

      return json.data;
    }

    async function initLineLogin() {
      if (!LIFF_ID || LIFF_ID.includes('你的')) {
        throw new Error('尚未設定 LIFF_ID');
      }

      await liff.init({
        liffId: LIFF_ID,
      });

      if (!liff.isLoggedIn()) {
        liff.login({
          redirectUri: window.location.href,
        });
        return null;
      }

      const profile = await liff.getProfile();
      const idToken = liff.getIDToken();

      if (!idToken) {
        throw new Error('無法取得 LINE ID Token，請確認 LIFF scope 有 openid/profile');
      }

      return {
        profile,
        idToken,
      };
    }

    function setState(patch) {
      Object.assign(state, patch);
      render();
    }

    function render() {
      const path = window.location.pathname;

      if (path.endsWith('/pos-scan') || path.includes('/pos-scan')) {
        renderStaffScanPage();
        return;
      }

      if (path.endsWith('/admin') || path.includes('/admin')) {
        renderAdminPage();
        return;
      }

      if (state.loading) {
        app.className = 'loading';
        app.innerHTML = '載入中...';
        return;
      }

      if (state.error) {
        app.className = 'error-page';
        app.innerHTML = escapeHtml(state.error);
        return;
      }

      if (!state.member) {
        app.className = 'error-page';
        app.innerHTML = '找不到會員資料';
        return;
      }

      const phoneVerified =
        state.member.phoneVerified === true ||
        state.member.phoneVerified === 'true';

      if (!phoneVerified) {
        renderVerifyPhone();
        return;
      }

      renderHomePage();
    }

    function renderVerifyPhone() {
      app.className = '';
      app.innerHTML = `
        <div class="verify-page">
          <div class="verify-card">
            <h1>會員註冊</h1>
            <p>請輸入手機號碼，送出後即可完成會員註冊。</p>

            <input
              id="phoneInput"
              placeholder="手機號碼，例如 0912345678"
              inputmode="tel"
            />

            <button id="bindPhoneBtn" type="button">送出註冊</button>

            <div id="verifyMsg" class="message"></div>
          </div>
        </div>
      `;

      document.getElementById('bindPhoneBtn').onclick = async () => {
        const phone = document.getElementById('phoneInput').value.trim();
        const btn = document.getElementById('bindPhoneBtn');
        const msg = document.getElementById('verifyMsg');

        msg.textContent = '';

        try {
          btn.disabled = true;
          btn.textContent = '送出中...';

          const data = await post('bindPhoneDirect', {
            idToken: state.idToken,
            phone,
          });

          const homeData = await post('getHomeData', {
            idToken: state.idToken,
          });

          state.member = homeData.member || data.member;
          state.activities = homeData.activities || [];
          state.coupons = homeData.coupons || [];
          state.couponUseLogs = homeData.couponUseLogs || [];
          state.walletLogs = homeData.walletLogs || [];
          state.loading = false;
          state.error = '';

          saveMemberCache();
          renderHomePage();
        } catch (err) {
          console.error(err);
          msg.textContent = err.message || '註冊失敗，請稍後再試';
          btn.disabled = false;
          btn.textContent = '送出註冊';
        }
      };
    }


    function renderHomePage() {
      const member = state.member;
      const displayName = escapeHtml(member.displayName || '會員');
      const level = escapeHtml(member.level || '解憂藥局會員');
      const pictureUrl = escapeHtml(
        member.pictureUrl || 'https://placehold.co/160x160?text=會員'
      );
      const points = Number(member.points || 0);
      const memberCode = String(member.barcodeValue || member.memberId || '');
      const qrUrl =
        'https://api.qrserver.com/v1/create-qr-code/?size=520x520&margin=2&data=' +
        encodeUrlValue(memberCode);

      app.className = '';
      app.innerHTML = `
        <div class="app-shell">
          <div class="hero">
            <div class="topbar">
              <div class="top-icon">☰</div>
              <div class="title">${escapeHtml(STORE_NAME)}</div>
              <div class="top-icon">🔔</div>
            </div>

            <div class="member-card" id="memberCard">
              <div class="member-card-inner">
                <div class="member-card-front">
                  <div class="card-left">
                    <div class="logo">解憂藥局</div>
                    <div class="card-name">${displayName}</div>
                    <div class="card-level">${level}</div>
                  </div>

                  <img class="avatar" src="${pictureUrl}" alt="會員頭像" loading="lazy" decoding="async" />

                  <div class="points-pill">剩餘點數 ${points}</div>
                </div>

                <div class="member-card-back">
                  <div class="card-back-left">
                    <div class="card-back-title">會員條碼</div>
                    <div class="card-back-code">${escapeHtml(memberCode)}</div>
                  </div>

                  <div class="card-back-qr">
                    <img alt="會員 QR Code" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" data-qr-src="${qrUrl}" loading="lazy" />
                  </div>
                </div>
              </div>
            </div>

            <div class="quick-tabs">
              <button data-tab="coupon" class="${state.tab === 'coupon' ? 'active' : ''}" type="button">
                <span class="tab-icon">🎁</span>
                優惠券
              </button>

              <button data-tab="couponHistory" class="${state.tab === 'couponHistory' ? 'active' : ''}" type="button">
                <span class="tab-icon">✓</span>
                使用紀錄
              </button>

              <button data-tab="wallet" class="${state.tab === 'wallet' ? 'active' : ''}" type="button">
                <span class="tab-icon">💰</span>
                儲值紀錄
              </button>
            </div>
          </div>

          <main class="content" id="content"></main>
        </div>
      `;

      document.querySelectorAll('[data-tab]').forEach((btn) => {
        btn.onclick = () => {
          state.tab = btn.dataset.tab;
          renderHomePage();
        };
      });

      const memberCard = document.getElementById('memberCard');

      if (memberCard) {
        let lastFlipAt = 0;

        function flipCard(event) {
          const now = Date.now();

          if (now - lastFlipAt < 450) {
            return;
          }

          event.preventDefault();
          event.stopPropagation();

          lastFlipAt = now;

          if (!memberCard.classList.contains('is-flipped')) {
            const qrImg = memberCard.querySelector('.card-back-qr img');

            if (
              qrImg &&
              qrImg.dataset &&
              qrImg.dataset.qrSrc &&
              qrImg.getAttribute('src') !== qrImg.dataset.qrSrc
            ) {
              qrImg.setAttribute('src', qrImg.dataset.qrSrc);
            }
          }

          memberCard.classList.toggle('is-flipped');
        }

        if (window.PointerEvent) {
          memberCard.addEventListener('pointerup', flipCard);
        } else {
          memberCard.addEventListener('click', flipCard);
        }
      }

      renderContent();
    }


    async function claimCoupon(memberCouponId) {
      const btn = document.querySelector(`[data-claim-coupon="${memberCouponId}"]`);
      const oldText = btn ? btn.textContent : '';

      try {
        if (btn) {
          btn.disabled = true;
          btn.textContent = '領取中...';
        }

        await post('claimMemberCoupon', {
          idToken: state.idToken,
          memberCouponId,
        });

        const homeData = await post('getHomeData', {
          idToken: state.idToken,
        });

        state.member = homeData.member || state.member;
        state.coupons = homeData.coupons || [];
        state.couponUseLogs = homeData.couponUseLogs || [];
        state.walletLogs = homeData.walletLogs || [];

        renderHomePage();
      } catch (err) {
        alert(err.message || String(err));

        if (btn) {
          btn.disabled = false;
          btn.textContent = oldText;
        }
      }
    }


    async function useCoupon(memberCouponId) {
      const btn = document.querySelector(`[data-use-coupon="${memberCouponId}"]`);
      const oldText = btn ? btn.textContent : '';

      const ok = confirm('確定要使用這張優惠券嗎？使用後會移到使用紀錄。');

      if (!ok) {
        return;
      }

      try {
        if (btn) {
          btn.disabled = true;
          btn.textContent = '使用中...';
        }

        await post('useOwnMemberCoupon', {
          idToken: state.idToken,
          memberCouponId,
        });

        const homeData = await post('getHomeData', {
          idToken: state.idToken,
        });

        state.member = homeData.member || state.member;
        state.coupons = homeData.coupons || [];
        state.couponUseLogs = homeData.couponUseLogs || [];
        state.walletLogs = homeData.walletLogs || [];

        state.tab = 'couponHistory';
        renderHomePage();
      } catch (err) {
        alert(err.message || String(err));

        if (btn) {
          btn.disabled = false;
          btn.textContent = oldText;
        }
      }
    }

    function renderCouponCard(c) {
      const isUnclaimed = String(c.status) === 'unclaimed';
      const amountText = c.couponAmount ? `折抵 ${escapeHtml(c.couponAmount)} 元` : '會員優惠';
      const statusText = isUnclaimed ? '未領取' : '已領取';

      return `
        <div class="coupon-native-card">
          <div class="coupon-native-img">
            ${c.imageUrl ? `<img src="${escapeHtml(c.imageUrl)}" alt="${escapeHtml(c.title || '優惠券')}">` : `<div class="coupon-native-placeholder">COUPON</div>`}
          </div>

          <div class="coupon-native-body">
            <div class="coupon-status-pill ${isUnclaimed ? 'unclaimed' : 'claimed'}">
              ${statusText}
            </div>

            <h3 class="coupon-native-title">${escapeHtml(c.title || '解憂藥局優惠券')}</h3>
            <p class="coupon-native-desc">${escapeHtml(c.description || '可於有效期限內使用。')}</p>

            <div class="coupon-info-grid">
              <div class="coupon-info-box">
                <div class="coupon-info-label">折抵金額</div>
                <div class="coupon-info-value green">${amountText}</div>
              </div>

              <div class="coupon-info-box">
                <div class="coupon-info-label">使用期限</div>
                <div class="coupon-info-value">${escapeHtml(formatSimpleDate(c.expiredAt) || '未設定')}</div>
              </div>
            </div>

            ${isUnclaimed ? `
              <button
                class="coupon-action-btn claim"
                type="button"
                data-claim-coupon="${escapeHtml(c.memberCouponId || c.id)}"
                onclick="claimCoupon('${escapeHtml(c.memberCouponId || c.id)}')"
              >
                領取優惠券
              </button>
            ` : `
              <button
                class="coupon-action-btn"
                type="button"
                data-use-coupon="${escapeHtml(c.memberCouponId || c.id)}"
                onclick="useCoupon('${escapeHtml(c.memberCouponId || c.id)}')"
              >
                使用該券
              </button>

              <div class="coupon-code-box">
                券號：${escapeHtml(c.memberCouponId || c.id || '')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderContent() {
      const content = document.getElementById('content');

      if (state.tab === 'coupon') {
        const unclaimed = (state.coupons || []).filter((c) => String(c.status) === 'unclaimed');
        const claimed = (state.coupons || []).filter((c) => String(c.status) === 'available');

        if (!unclaimed.length && !claimed.length) {
          content.innerHTML = `
            <div class="empty">
              <h2>優惠券</h2>
              <p>目前沒有可用優惠券。</p>
            </div>
          `;
          return;
        }

        content.innerHTML = `
          <div class="list">
            ${unclaimed.length ? `
              <div class="coupon-section-title">未領取</div>
              ${unclaimed.map(renderCouponCard).join('')}
            ` : ''}

            ${claimed.length ? `
              <div class="coupon-section-title">已領取</div>
              ${claimed.map(renderCouponCard).join('')}
            ` : ''}
          </div>
        `;
        return;
      }

      if (state.tab === 'couponHistory') {
        const logs = state.couponUseLogs || [];

        if (!logs.length) {
          content.innerHTML = `
            <div class="empty">
              <h2>優惠券使用紀錄</h2>
              <p>目前尚無使用紀錄。</p>
            </div>
          `;
          return;
        }

        content.innerHTML = `
          <div class="record-list">
            ${logs.map((log) => {
              const amountText = log.couponAmount ? `折抵 ${escapeHtml(log.couponAmount)} 元` : '優惠券';
              const usedAtText = formatSimpleDateTime(log.usedAt);

              return `
                <div class="record-card coupon-used-record">
                  <div class="record-title">${escapeHtml(log.title || '優惠券')}</div>

                  <div class="used-coupon-amount">${amountText}</div>

                  <div class="record-meta">使用時間：${escapeHtml(usedAtText || '未記錄')}</div>

                  <div class="record-meta record-code">
                    券號：${escapeHtml(log.memberCouponId || '')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        return;
      }

      if (state.tab === 'wallet') {
        const logs = state.walletLogs || [];

        if (!logs.length) {
          content.innerHTML = `
            <div class="empty">
              <h2>儲值紀錄</h2>
              <p>目前尚無儲值紀錄。</p>
            </div>
          `;
          return;
        }

        content.innerHTML = `
          <div class="record-list">
            ${logs.map((log) => {
              const amount = Number(log.amount || 0);

              return `
                <div class="record-card">
                  <div class="record-title">${escapeHtml(log.type || '儲值紀錄')}</div>
                  <div class="record-amount ${amount < 0 ? 'negative' : ''}">
                    ${amount >= 0 ? '+' : ''}${escapeHtml(amount)}
                  </div>
                  <div class="record-meta">時間：${escapeHtml(formatSimpleDateTime(log.createdAt) || '')}</div>
                  <div class="record-meta">方式：${escapeHtml(log.payMethod || '未設定')}</div>
                  <div class="record-meta">備註：${escapeHtml(log.note || '')}</div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
    }


    function renderStaffScanPage() {
      app.className = '';
      app.innerHTML = `
        <div class="staff-page">
          <div class="staff-card">
            <h1>解憂藥局｜店家掃碼加點</h1>

            <input id="staffPin" placeholder="店員 PIN" />
            <input id="barcodeValue" placeholder="掃描或貼上會員條碼" />

            <button id="findMemberBtn" type="button">查詢會員</button>

            <div id="memberResult"></div>

            <div id="staffMsg" class="message"></div>
          </div>
        </div>
      `;

      document.getElementById('findMemberBtn').onclick = async () => {
        const staffPin = document.getElementById('staffPin').value.trim();
        const barcodeValue = document.getElementById('barcodeValue').value.trim();
        const msg = document.getElementById('staffMsg');
        const result = document.getElementById('memberResult');

        msg.textContent = '';
        result.innerHTML = '';

        try {
          const data = await post('staffFindMember', {
            staffPin,
            barcodeValue,
          });

          const m = data.member;

          result.innerHTML = `
            <div class="member-result">
              <b>${escapeHtml(m.displayName)}</b>
              <p>會員編號：${escapeHtml(m.memberId)}</p>
              <p>目前點數：${escapeHtml(m.points)}</p>

              <input id="pointsInput" type="number" value="1" />
              <input id="noteInput" placeholder="備註，例如消費加點" />

              <button id="addPointsBtn" type="button">確認累積點數</button>
            </div>
          `;

          document.getElementById('addPointsBtn').onclick = async () => {
            const points = Number(document.getElementById('pointsInput').value || 0);
            const note = document.getElementById('noteInput').value.trim();

            msg.textContent = '';

            try {
              const updated = await post('staffAddPoints', {
                staffPin,
                barcodeValue,
                points,
                note,
              });

              msg.textContent =
                '已完成點數更新\n目前點數：' + updated.member.points;
            } catch (err) {
              msg.textContent = err.message || String(err);
            }
          };
        } catch (err) {
          msg.textContent = err.message || String(err);
        }
      };
    }

    function renderAdminPage() {
      app.className = '';
      app.innerHTML = `
        <div class="staff-page">
          <div class="staff-card">
            <h1>解憂藥局｜簡易管理後台</h1>

            <input id="adminPin" placeholder="管理 PIN" />
            <input id="activityTitle" placeholder="活動標題" />
            <input id="activityImageUrl" placeholder="活動圖片網址" />
            <textarea id="activityContent" placeholder="活動內容"></textarea>
            <input id="activityEndAt" placeholder="到期日，例如 2026/7/31" />

            <button id="createActivityBtn" type="button">新增活動</button>

            <div id="adminMsg" class="message"></div>
          </div>
        </div>
      `;

      document.getElementById('createActivityBtn').onclick = async () => {
        const msg = document.getElementById('adminMsg');

        msg.textContent = '';

        try {
          await post('adminCreateActivity', {
            adminPin: document.getElementById('adminPin').value.trim(),
            title: document.getElementById('activityTitle').value.trim(),
            imageUrl: document.getElementById('activityImageUrl').value.trim(),
            content: document.getElementById('activityContent').value.trim(),
            endAt: document.getElementById('activityEndAt').value.trim(),
          });

          document.getElementById('activityTitle').value = '';
          document.getElementById('activityImageUrl').value = '';
          document.getElementById('activityContent').value = '';
          document.getElementById('activityEndAt').value = '';

          msg.textContent = '活動已新增';
        } catch (err) {
          msg.textContent = err.message || String(err);
        }
      };
    }

    async function boot() {
      const path = window.location.pathname;

      if (path.endsWith('/pos-scan') || path.includes('/pos-scan')) {
        renderStaffScanPage();
        return;
      }

      if (path.endsWith('/admin') || path.includes('/admin')) {
        renderAdminPage();
        return;
      }

      const cached = readMemberCache();

      if (cached && cached.member) {
        state.loading = false;
        state.error = '';
        state.member = cached.member;
        state.activities = cached.activities || [];
        state.coupons = cached.coupons || [];
        state.couponUseLogs = cached.couponUseLogs || [];
        state.walletLogs = cached.walletLogs || [];
        render();
      }

      try {
        const auth = await initLineLogin();

        if (!auth) {
          return;
        }

        const bootData = await post('bootstrapMember', {
          idToken: auth.idToken,
          profile: auth.profile,
        });

        state.loading = false;
        state.error = '';
        state.idToken = auth.idToken;
        state.profile = auth.profile;
        state.member = bootData.member;
        state.activities = state.activities || [];
        state.coupons = state.coupons || [];
        state.couponUseLogs = state.couponUseLogs || [];
        state.walletLogs = state.walletLogs || [];

        render();
        saveMemberCache();

        post('getHomeData', {
          idToken: auth.idToken,
        })
          .then(function (homeData) {
            state.member = homeData.member || bootData.member;
            state.activities = homeData.activities || [];
            state.coupons = homeData.coupons || [];
            state.couponUseLogs = homeData.couponUseLogs || [];
            state.walletLogs = homeData.walletLogs || [];
            saveMemberCache();
            render();
          })
          .catch(function (err) {
            console.warn('背景載入活動 / 禮券失敗：', err);
          });
      } catch (err) {
        if (cached && cached.member) {
          console.warn('背景更新會員資料失敗，但已使用快取：', err);
          return;
        }

        setState({
          loading: false,
          error: err.message || String(err),
        });
      }
    }

    boot();
  </script>
</body>
</html>

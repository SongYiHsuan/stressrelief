<!doctype html>

<head>

  <title>解憂藥局會員</title>

  <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
  <link rel="dns-prefetch" href="https://static.line-scdn.net">
  <link rel="preconnect" href="https://script.google.com">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
      background: #f7f7f7;

    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .loading,
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-size: 20px;
      text-align: center;
    }

    .error-page {
      color: #9b1c1c;
    }

    .app-shell {
      min-height: 100vh;
      background: #fff;
    }

    .hero {
      background: linear-gradient(140deg, #202020, #4b4742 60%, #221d1d);
      color: white;
      padding: env(safe-area-inset-top) 18px 0;
    }

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-icon {
      font-size: 30px;
      line-height: 1;
      opacity: 0.95;
    }

    .title {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }



    .member-card {
      position: relative !important;
      display: block !important;
      width: 100% !important;
      height: 190px !important;
      min-height: 190px !important;
      max-height: 190px !important;
      border-radius: 14px !important;
      perspective: 1200px !important;
      -webkit-perspective: 1200px !important;
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: visible !important;
      cursor: pointer !important;
      -webkit-tap-highlight-color: transparent;
    }

    .member-card-inner {
      position: relative !important;
      display: block !important;
      width: 100% !important;
      height: 190px !important;
      min-height: 190px !important;
      max-height: 190px !important;
      border-radius: 14px !important;
      transform-style: preserve-3d !important;
      -webkit-transform-style: preserve-3d !important;
      transition: transform 0.55s ease !important;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22) !important;
    }

    .member-card.is-flipped .member-card-inner {
      transform: rotateY(180deg) !important;
      -webkit-transform: rotateY(180deg) !important;
    }

    .member-card-front,
    .member-card-back {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 190px !important;
      min-height: 190px !important;
      max-height: 190px !important;
      border-radius: 14px !important;
      overflow: hidden !important;
      backface-visibility: hidden !important;
      -webkit-backface-visibility: hidden !important;
      transform-style: preserve-3d !important;
      -webkit-transform-style: preserve-3d !important;
    }

    .member-card-front {
      z-index: 2 !important;
      transform: rotateY(0deg) translateZ(1px) !important;
      -webkit-transform: rotateY(0deg) translateZ(1px) !important;
      background: radial-gradient(
        circle at 70% 35%,
        #fff7a8 0,
        #c9ad3f 28%,
        #62552e 58%,

    .member-card-back {
      z-index: 1 !important;
      transform: rotateY(180deg) translateZ(1px) !important;
      -webkit-transform: rotateY(180deg) translateZ(1px) !important;

      color: #263238 !important;
      padding: 16px 14px 16px 18px !important;
      display: grid !important;

    }

    .card-left {
      position: relative !important;
      z-index: 2 !important;

    }

    .logo {
      width: 82px !important;
      height: 30px !important;
      background: rgba(255, 255, 255, 0.86) !important;

      display: grid !important;
      place-items: center !important;

    }

    .card-name {
      max-width: 145px !important;

      line-height: 1.2 !important;
      font-weight: 900 !important;

    .card-level {

    .avatar {

    .points-pill {

    .card-back-left {

    }

    .card-back-title {

    .card-back-code {

    .card-back-qr {

    .card-back-qr img {
      width: 100% !important;

    }

    .quick-tabs {

    }

    .quick-tabs button {
      color: rgba(255, 255, 255, 0.66);

      padding: 10px 4px 16px;

    }

    .quick-tabs .tab-icon {

    }

    .quick-tabs button.active {

      border-bottom-color: #ffe500;

    }

    .content {
      background: #fff;
      border-radius: 22px 22px 0 0;
      margin-top: -1px;
      padding: 20px 18px 60px;
      min-height: 50vh;
    }

    .list {
      display: grid;
      gap: 18px;
    }

    .activity-card,
    .coupon-card {
      background: #fff;

    .activity-card img,
    .coupon-card img {

    }

    .activity-card h3,

    }

    }

    .activity-card span,
    .coupon-card span {

    }

    }

    .modal-mask {
      position: fixed;

      background: rgba(0, 0, 0, 0.62);
      display: flex;
      align-items: flex-end;
      z-index: 10000;
      touch-action: none;
    }

    .modal-open {
      overflow: hidden;
    }

    .modal-card {
      position: relative;
      width: 100%;
      background: white;
      color: #333;
      border-radius: 22px 22px 0 0;
      padding: 26px 24px 36px;
      text-align: center;
      animation: slideUp 0.18s ease-out;
      z-index: 10001;
      touch-action: auto;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);

      }

        transform: translateY(0);
        opacity: 1;
      }

    .icon-close {
      position: absolute;

      height: 58px;
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      font-size: 46px;
      line-height: 1;

      place-items: center;

    }

    .modal-card h2 {

    .barcode-box {

    }

    .barcode-svg {

    .member-code {

    .modal-close-bottom {

    .barcode-page {

    .barcode-page-card {

    .verify-card button,

  </style>

<body>
  <div id="app" class="loading">載入中...</div>

  <script>
    const LIFF_ID = '2010622307-PCCxkTmN';
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxMSpax3wc4n6nOG7hWzljLq9VNQqEHIm4_BRsU5Qyqw27S80IzxUhfiAkNe6u7eBB9NA/exec';
    const STORE_NAME = '解憂藥局';

    const app = document.getElementById('app');

    const CACHE_KEY = 'stressrelief_member_cache_v1';

    function saveMemberCache() {
      try {
        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            member: state.member,
            activities: state.activities || [],
            coupons: state.coupons || [],
            savedAt: Date.now(),
          })
        );
      } catch (err) {
        console.warn('save cache failed', err);
      }
    }

    function readMemberCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;

        const data = JSON.parse(raw);

        if (!data || !data.member) return null;

        // 快取最多保留 12 小時
        if (Date.now() - Number(data.savedAt || 0) > 12 * 60 * 60 * 1000) {
          return null;
        }

        return data;
      } catch (err) {
        console.warn('read cache failed', err);
        return null;
      }
    }


    const state = {
      loading: true,
      error: '',
      idToken: '',
      profile: null,
      member: null,
      activities: [],
      coupons: [],
      tab: 'activity',
      view: 'home',
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }


    function encodeUrlValue(value) {
      return encodeURIComponent(String(value ?? ''));
    }

    async function post(action, payload = {}) {
      if (!GAS_API_URL || GAS_API_URL.includes('你的')) {
        throw new Error('尚未設定 GAS_API_URL');
      }

      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify({
          action,
          ...payload,
        }),
      });

      const json = await res.json();

      if (!json.success) {
        throw new Error(json.message || 'API 發生錯誤');
      }

      return json.data;
    }

    async function initLineLogin() {
      if (!LIFF_ID || LIFF_ID.includes('你的')) {
        throw new Error('尚未設定 LIFF_ID');
      }

      await liff.init({
        liffId: LIFF_ID,
      });

      if (!liff.isLoggedIn()) {
        liff.login({
          redirectUri: window.location.href,
        });
        return null;
      }

      const profile = await liff.getProfile();
      const idToken = liff.getIDToken();

      if (!idToken) {
        throw new Error('無法取得 LINE ID Token，請確認 LIFF scope 有 openid/profile');
      }

      return {
        profile,
        idToken,
      };
    }

    function setState(patch) {
      Object.assign(state, patch);
      render();
    }

    function render() {
      const path = window.location.pathname;

      if (path.endsWith('/pos-scan') || path.includes('/pos-scan')) {
        renderStaffScanPage();
        return;
      }

      if (path.endsWith('/admin') || path.includes('/admin')) {
        renderAdminPage();
        return;
      }

      if (state.loading) {
        app.className = 'loading';
        app.innerHTML = '載入中...';
        return;
      }

      if (state.error) {
        app.className = 'error-page';
        app.innerHTML = escapeHtml(state.error);
        return;
      }

      if (!state.member) {
        app.className = 'error-page';
        app.innerHTML = '找不到會員資料';
        return;
      }

      const phoneVerified =
        state.member.phoneVerified === true ||
        state.member.phoneVerified === 'true';

      if (!phoneVerified) {
        renderVerifyPhone();
        return;
      }

      renderHomePage();
    }

    function renderVerifyPhone() {
      app.className = '';
      app.innerHTML = `
        <div class="verify-page">
          <div class="verify-card">
            <h1>綁定手機號碼</h1>
            <p>第一次使用解憂藥局會員功能，請先完成手機驗證。</p>

            <input
              id="phoneInput"
              placeholder="手機號碼，例如 0912345678"
              inputmode="tel"
            />

            <button id="sendOtpBtn">傳送驗證碼</button>

            <div id="otpArea" style="display:none;">
              <input
                id="codeInput"
                placeholder="輸入 6 位數驗證碼"
                inputmode="numeric"
              />

              <div id="debugCode" class="debug-code" style="display:none;"></div>

              <button id="verifyOtpBtn">完成驗證</button>
            </div>

            <div id="verifyMsg" class="message"></div>
          </div>
        </div>
      `;

      let otpId = '';

      document.getElementById('sendOtpBtn').onclick = async () => {
        const phone = document.getElementById('phoneInput').value.trim();
        const msg = document.getElementById('verifyMsg');
        const debugCode = document.getElementById('debugCode');

        msg.textContent = '';

        try {
          const data = await post('sendOtp', {
            idToken: state.idToken,
            phone,
          });

          otpId = data.otpId;

          document.getElementById('otpArea').style.display = 'block';

          if (data.debugCode) {
            debugCode.style.display = 'block';
            debugCode.textContent = '測試驗證碼：' + data.debugCode;
          }

          msg.textContent = '驗證碼已送出，請輸入 6 位數驗證碼。';
        } catch (err) {
          msg.textContent = err.message || String(err);
        }
      };

      document.getElementById('verifyOtpBtn').onclick = async () => {
        const code = document.getElementById('codeInput').value.trim();
        const msg = document.getElementById('verifyMsg');

        msg.textContent = '';

        try {
          const data = await post('verifyOtp', {
            idToken: state.idToken,
            otpId,
            code,
          });

          setState({
            member: data.member,
          });
        } catch (err) {
          msg.textContent = err.message || String(err);
        }
      };
    }

    function renderHomePage() {
      const member = state.member;
      const displayName = escapeHtml(member.displayName || '會員');
      const level = escapeHtml(member.level || '解憂藥局會員');
      const pictureUrl = escapeHtml(
        member.pictureUrl || 'https://placehold.co/160x160?text=會員'
      );
      const points = Number(member.points || 0);
      const memberCode = String(member.barcodeValue || member.memberId || '');
      const qrUrl =
        'https://api.qrserver.com/v1/create-qr-code/?size=520x520&margin=2&data=' +
        encodeUrlValue(memberCode);

      app.className = '';
      app.innerHTML = `
        <div class="app-shell">
          <div class="hero">
            <div class="topbar">
              <div class="top-icon">☰</div>
              <div class="title">${escapeHtml(STORE_NAME)}</div>
              <div class="top-icon">🔔</div>
            </div>

            <div class="member-card" id="memberCard">
              <div class="member-card-inner">
                <div class="member-card-front">
                  <div class="card-left">
                    <div class="logo">解憂藥局</div>
                    <div class="card-name">${displayName}</div>
                    <div class="card-level">${level}</div>
                  </div>

                  <img class="avatar" src="${pictureUrl}" alt="會員頭像" loading="lazy" decoding="async" />

                  <div class="points-pill">剩餘點數 ${points}</div>
                </div>

                <div class="member-card-back">
                  <div class="card-back-left">
                    <div class="card-back-title">會員條碼</div>
                    <div class="card-back-code">${escapeHtml(memberCode)}</div>
                  </div>

                  <div class="card-back-qr">
                    <img alt="會員 QR Code" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" data-qr-src="${qrUrl}" loading="lazy" />
                  </div>
                </div>
              </div>
            </div>

            <div class="quick-tabs">
              <button data-tab="activity" class="${state.tab === 'activity' ? 'active' : ''}" type="button">
                <span class="tab-icon">⌂</span>
                近期活動
              </button>

              <button data-tab="coupon" class="${state.tab === 'coupon' ? 'active' : ''}" type="button">
                <span class="tab-icon">🎁</span>
                禮物券
              </button>

              <button data-tab="news" class="${state.tab === 'news' ? 'active' : ''}" type="button">
                <span class="tab-icon">▣</span>
                品牌動態
              </button>

              <button data-tab="order" class="${state.tab === 'order' ? 'active' : ''}" type="button">
                <span class="tab-icon">▤</span>
                歷史訂單
              </button>
            </div>
          </div>

          <main class="content" id="content"></main>
        </div>
      `;

      document.querySelectorAll('[data-tab]').forEach((btn) => {
        btn.onclick = () => {
          state.tab = btn.dataset.tab;
          renderHomePage();
        };
      });

      const memberCard = document.getElementById('memberCard');

      if (memberCard) {
        let lastFlipAt = 0;

        function flipCard(event) {
          const now = Date.now();

          if (now - lastFlipAt < 450) {
            return;
          }

          event.preventDefault();
          event.stopPropagation();

          lastFlipAt = now;

          if (!memberCard.classList.contains('is-flipped')) {
            const qrImg = memberCard.querySelector('.card-back-qr img');

            if (
              qrImg &&
              qrImg.dataset &&
              qrImg.dataset.qrSrc &&
              qrImg.getAttribute('src') !== qrImg.dataset.qrSrc
            ) {
              qrImg.setAttribute('src', qrImg.dataset.qrSrc);
            }
          }

          memberCard.classList.toggle('is-flipped');
        }

        if (window.PointerEvent) {
          memberCard.addEventListener('pointerup', flipCard);
        } else {
          memberCard.addEventListener('click', flipCard);
        }
      }

      renderContent();
    }

    function renderContent() {
      const content = document.getElementById('content');

      if (state.tab === 'activity') {
        if (!state.activities.length) {
          content.innerHTML = `
            <div class="empty">
              <h2>近期活動</h2>
              <p>目前尚無活動。</p>
            </div>
          `;
          return;
        }

        content.innerHTML = `
          <div class="list">
            ${state.activities.map((a) => `
              <div class="activity-card">
                ${a.imageUrl ? `<img src="${escapeHtml(a.imageUrl)}" alt="${escapeHtml(a.title)}" loading="lazy" decoding="async">` : ''}
                <h3>${escapeHtml(a.title)}</h3>
                <p>${escapeHtml(a.content)}</p>
                <span>到期日：${escapeHtml(a.endAt || '未設定')}</span>
              </div>
            `).join('')}
          </div>
        `;
        return;
      }

      if (state.tab === 'coupon') {
        if (!state.coupons.length) {
          content.innerHTML = `
            <div class="empty">
              <h2>禮物券</h2>
              <p>目前沒有可用禮物券。</p>
            </div>
          `;
          return;
        }

        content.innerHTML = `
          <div class="list">
            ${state.coupons.map((c) => `
              <div class="coupon-card">
                ${c.imageUrl ? `<img src="${escapeHtml(c.imageUrl)}" alt="${escapeHtml(c.title)}" loading="lazy" decoding="async">` : ''}
                <h3>${escapeHtml(c.title)}</h3>
                <p>${escapeHtml(c.description)}</p>
                <span>狀態：${escapeHtml(c.status)}</span>
              </div>
            `).join('')}
          </div>
        `;
        return;
      }

      if (state.tab === 'news') {
        content.innerHTML = `
          <div class="empty">
            <h2>品牌動態</h2>
            <p>最新公告、門市消息。</p>
          </div>
        `;
        return;
      }

      if (state.tab === 'order') {
        content.innerHTML = `
          <div class="empty">
            <h2>歷史訂單</h2>
            <p>訂單資料。</p>
          </div>
        `;
      }
    }


    function renderStaffScanPage() {
      app.className = '';
      app.innerHTML = `
        <div class="staff-page">
          <div class="staff-card">
            <h1>解憂藥局｜店家掃碼加點</h1>

            <input id="staffPin" placeholder="店員 PIN" />
            <input id="barcodeValue" placeholder="掃描或貼上會員條碼" />

            <button id="findMemberBtn" type="button">查詢會員</button>

            <div id="memberResult"></div>

            <div id="staffMsg" class="message"></div>
          </div>
        </div>
      `;

      document.getElementById('findMemberBtn').onclick = async () => {
        const staffPin = document.getElementById('staffPin').value.trim();
        const barcodeValue = document.getElementById('barcodeValue').value.trim();
        const msg = document.getElementById('staffMsg');
        const result = document.getElementById('memberResult');

        msg.textContent = '';
        result.innerHTML = '';

        try {
          const data = await post('staffFindMember', {
            staffPin,
            barcodeValue,
          });

          const m = data.member;

          result.innerHTML = `
            <div class="member-result">
              <b>${escapeHtml(m.displayName)}</b>
              <p>會員編號：${escapeHtml(m.memberId)}</p>
              <p>目前點數：${escapeHtml(m.points)}</p>

              <input id="pointsInput" type="number" value="1" />
              <input id="noteInput" placeholder="備註，例如消費加點" />

              <button id="addPointsBtn" type="button">確認累積點數</button>
            </div>
          `;

          document.getElementById('addPointsBtn').onclick = async () => {
            const points = Number(document.getElementById('pointsInput').value || 0);
            const note = document.getElementById('noteInput').value.trim();

            msg.textContent = '';

            try {
              const updated = await post('staffAddPoints', {
                staffPin,
                barcodeValue,
                points,
                note,
              });

              msg.textContent =
                '已完成點數更新\n目前點數：' + updated.member.points;
            } catch (err) {
              msg.textContent = err.message || String(err);
            }
          };
        } catch (err) {
          msg.textContent = err.message || String(err);
        }
      };
    }

    function renderAdminPage() {
      app.className = '';
      app.innerHTML = `
        <div class="staff-page">
          <div class="staff-card">
            <h1>解憂藥局｜簡易管理後台</h1>

            <input id="adminPin" placeholder="管理 PIN" />
            <input id="activityTitle" placeholder="活動標題" />
            <input id="activityImageUrl" placeholder="活動圖片網址" />
            <textarea id="activityContent" placeholder="活動內容"></textarea>
            <input id="activityEndAt" placeholder="到期日，例如 2026/7/31" />

            <button id="createActivityBtn" type="button">新增活動</button>

            <div id="adminMsg" class="message"></div>
          </div>
        </div>
      `;

      document.getElementById('createActivityBtn').onclick = async () => {
        const msg = document.getElementById('adminMsg');

        msg.textContent = '';

        try {
          await post('adminCreateActivity', {
            adminPin: document.getElementById('adminPin').value.trim(),
            title: document.getElementById('activityTitle').value.trim(),
            imageUrl: document.getElementById('activityImageUrl').value.trim(),
            content: document.getElementById('activityContent').value.trim(),
            endAt: document.getElementById('activityEndAt').value.trim(),
          });

          document.getElementById('activityTitle').value = '';
          document.getElementById('activityImageUrl').value = '';
          document.getElementById('activityContent').value = '';
          document.getElementById('activityEndAt').value = '';

          msg.textContent = '活動已新增';
        } catch (err) {
          msg.textContent = err.message || String(err);
        }
      };
    }

    async function boot() {
      const path = window.location.pathname;

      if (path.endsWith('/pos-scan') || path.includes('/pos-scan')) {
        renderStaffScanPage();
        return;
      }

      if (path.endsWith('/admin') || path.includes('/admin')) {
        renderAdminPage();
        return;
      }

      const cached = readMemberCache();

      if (cached && cached.member) {
        state.loading = false;
        state.error = '';
        state.member = cached.member;
        state.activities = cached.activities || [];
        state.coupons = cached.coupons || [];
        render();
      }

      try {
        const auth = await initLineLogin();

        if (!auth) {
          return;
        }

        const bootData = await post('bootstrapMember', {
          idToken: auth.idToken,
          profile: auth.profile,
        });

        state.loading = false;
        state.error = '';
        state.idToken = auth.idToken;
        state.profile = auth.profile;
        state.member = bootData.member;
        state.activities = state.activities || [];
        state.coupons = state.coupons || [];

        render();
        saveMemberCache();

        post('getHomeData', {
          idToken: auth.idToken,
        })
          .then(function (homeData) {
            state.member = homeData.member || bootData.member;
            state.activities = homeData.activities || [];
            state.coupons = homeData.coupons || [];
            saveMemberCache();
            render();
          })
          .catch(function (err) {
            console.warn('背景載入活動 / 禮券失敗：', err);
          });
      } catch (err) {
        if (cached && cached.member) {
          console.warn('背景更新會員資料失敗，但已使用快取：', err);
          return;
        }

        setState({
          loading: false,
          error: err.message || String(err),
        });
      }
    }

    boot();
  </script>
</body>
</html>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #253238;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .loading,
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-size: 20px;
      text-align: center;
    }

    .error-page {
      color: #9b1c1c;
    }

    .app-shell {
      min-height: 100vh;
      background: #fff;
    }

    .hero {
      background: linear-gradient(140deg, #202020, #4b4742 60%, #221d1d);
      color: white;
      padding: env(safe-area-inset-top) 18px 0 0;
    }

    .topbar {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px 6px;
      background: #ffffff;
    }

    .top-icon {
      display: none !important;
    }

    .title {
      display: none !important;
    }

    .header-logo {
      width: min(72vw, 270px);
      max-height: 42px;
      height: auto;
      display: block;
      object-fit: contain;
    }



    .member-card {
      position: relative !important;
      display: block !important;
      width: 100% !important;
      height: 190px !important;
      min-height: 190px !important;
      max-height: 190px !important;
      border-radius: 14px !important;
      perspective: 1200px !important;
      -webkit-perspective: 1200px !important;
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: visible !important;
      cursor: pointer !important;
      -webkit-tap-highlight-color: transparent;
    }

    .member-card-inner {
      position: relative !important;
      display: block !important;
      width: 100% !important;
      height: 190px !important;
      min-height: 190px !important;
      max-height: 190px !important;
      border-radius: 14px !important;
      transform-style: preserve-3d !important;
      -webkit-transform-style: preserve-3d !important;
      transition: transform 0.55s ease !important;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22) !important;
    }

    .member-card.is-flipped .member-card-inner {
      transform: rotateY(180deg) !important;
      -webkit-transform: rotateY(180deg) !important;
    }

    .member-card-front,
    .member-card-back {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 190px !important;
      min-height: 190px !important;
      max-height: 190px !important;
      border-radius: 14px !important;
      overflow: hidden !important;
      backface-visibility: hidden !important;
      -webkit-backface-visibility: hidden !important;
      transform-style: preserve-3d !important;
      -webkit-transform-style: preserve-3d !important;
    }

    .member-card-front {
      z-index: 2 !important;
      transform: rotateY(0deg) translateZ(1px) !important;
      -webkit-transform: rotateY(0deg) translateZ(1px) !important;
      background: radial-gradient(
        circle at 70% 35%,
        #fff7a8 0,
        #c9ad3f 28%,
        #62552e 58%,
        #24211a 100%
      ) !important;
      padding: 18px !important;
    }

    .member-card-back {
      z-index: 1 !important;
      transform: rotateY(180deg) translateZ(1px) !important;
      -webkit-transform: rotateY(180deg) translateZ(1px) !important;
      background: #ffffff !important;
      color: #263238 !important;
      padding: 16px 14px 16px 18px !important;
      display: grid !important;
      grid-template-columns: minmax(0, 1fr) 154px !important;
      gap: 10px !important;
      align-items: center !important;
    }

    .card-left {
      position: relative !important;
      z-index: 2 !important;
      width: 150px !important;
      padding-top: 76px !important;
    }

    .logo {
      display: none !important;
    }

    .card-name {
      max-width: 145px !important;
      font-size: 19px !important;
      line-height: 1.2 !important;
      font-weight: 900 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.35) !important;
    }

    .card-level {
      max-width: 145px !important;
      margin-top: 6px !important;
      font-size: 13px !important;
      line-height: 1.2 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }

    .avatar {
      position: absolute !important;
      width: 116px !important;
      height: 116px !important;
      border-radius: 999px !important;
      object-fit: cover !important;
      background: #eee !important;
      border: 5px solid rgba(255, 255, 255, 0.9) !important;
      left: 52% !important;
      top: 34px !important;
      transform: translateX(-50%) !important;
      -webkit-transform: translateX(-50%) !important;
      z-index: 1 !important;
    }

    .points-pill {
      position: absolute !important;
      top: 12px !important;
      right: 12px !important;
      background: rgba(0, 0, 0, 0.5) !important;
      color: #ffe84d !important;
      padding: 8px 12px !important;
      border-radius: 999px !important;
      font-weight: 800 !important;
      z-index: 3 !important;
    }

    .barcode-button {
      display: none !important;
    }

    .card-back-left {
      min-width: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: flex-start !important;
      gap: 16px !important;
      height: 100% !important;
      overflow: hidden !important;
    }

    .card-back-title {
      font-size: 24px !important;
      font-weight: 900 !important;
      line-height: 1.1 !important;
      color: #263238 !important;
      margin: 0 !important;
      text-align: left !important;
      white-space: nowrap !important;
    }

    .card-back-code {
      font-size: 14px !important;
      line-height: 1.2 !important;
      letter-spacing: 1px !important;
      color: #444 !important;
      text-align: left !important;
      font-weight: 900 !important;
      white-space: nowrap !important;
      word-break: normal !important;
      overflow-wrap: normal !important;
      max-width: 100% !important;
    }

    .card-back-qr {
      width: 154px !important;
      height: 154px !important;
      min-width: 154px !important;
      min-height: 154px !important;
      border-radius: 14px !important;
      background: #fff !important;
      padding: 4px !important;
      border: 1px solid #e8e8e8 !important;
      justify-self: end !important;
      align-self: center !important;
    }

    .card-back-qr img {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    .quick-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 18px;
    }

    .quick-tabs button {
      color: rgba(255, 255, 255, 0.66);
      background: transparent;
      padding: 10px 4px 16px;
      border-bottom: 4px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 15px;
    }

    .quick-tabs .tab-icon {
      font-size: 26px;
      line-height: 1;
    }

    .quick-tabs button.active {
      color: white;
      border-bottom-color: #ffe500;
      font-weight: 900;
    }

    .content {
      background: #fff;
      border-radius: 22px 22px 0 0;
      margin-top: -1px;
      padding: 20px 18px 60px;
      min-height: 50vh;
    }

    .list {
      display: grid;
      gap: 18px;
    }

    .activity-card,
    .coupon-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);

    .coupon-card img {
      width: 100%;
      display: block;
      max-height: 190px;
      object-fit: cover;
      background: #eee;

    .activity-card h3,
    .coupon-card h3 {
      margin: 14px 14px 4px;
      font-size: 20px;
      color: #263b43;
    }

    .activity-card p,

      margin: 6px 14px;
      color: #5a676b;
      line-height: 1.55;
    }

    .activity-card span,
    .coupon-card span {
      display: block;
      padding: 8px 14px 16px;
      color: #8a8f90;
    }

    .empty {
      padding: 40px 18px;
      text-align: center;
      color: #667;
    }

    .empty h2 {
      color: #253238;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      display: flex;
      align-items: flex-end;
      z-index: 10000;
      touch-action: none;
    }

    .modal-open {
      overflow: hidden;
    }

    .modal-card {
      position: relative;
      width: 100%;
      background: white;
      color: #333;
      border-radius: 22px 22px 0 0;
      padding: 26px 24px 36px;
      text-align: center;
      animation: slideUp 0.18s ease-out;
      z-index: 10001;
      touch-action: auto;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0.7;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .icon-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 58px;
      height: 58px;
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      font-size: 46px;
      line-height: 1;
      z-index: 10002;
      display: grid;
      place-items: center;
      border-radius: 999px;
      touch-action: manipulation;
      pointer-events: auto;
    }

    .modal-card h2 {
      margin: 6px 0 26px;
      font-size: 25px;
    }

    .barcode-box {
      display: flex;
      justify-content: center;
      margin: 0 auto 18px;
      overflow: hidden;
    }

    .barcode-svg {
      width: min(100%, 590px);
      height: 88px;
    }

    .member-code {
      letter-spacing: 5px;
      font-size: 22px;
      margin-bottom: 24px;
      word-break: break-all;
    }

    .qr-wrap {
      display: flex;
      justify-content: center;
    }

    .hint {
      color: #808080;
      font-weight: 700;
      line-height: 1.7;
      margin: 24px 6px 0;
    }

    .modal-close-bottom {
      width: 100%;
      margin-top: 24px;
      border-radius: 14px;
      padding: 14px;
      background: #111;
      color: #fff;
      font-weight: 900;
      font-size: 18px;
      touch-action: manipulation;
      pointer-events: auto;
    }


    .barcode-page {
      min-height: 100vh;
      background: rgba(0, 0, 0, 0.62);
      padding: calc(env(safe-area-inset-top) + 24px) 0 0;
      display: flex;
      align-items: flex-end;
    }

    .barcode-page-card {
      position: relative;
      width: 100%;
      min-height: 72vh;
      background: #fff;
      color: #333;
      border-radius: 22px 22px 0 0;
      padding: 34px 24px 36px;
      text-align: center;
    }

    .barcode-page-card h2 {
      margin: 6px 0 32px;
      font-size: 34px;
      font-weight: 900;
      color: #333;
    }

    .barcode-page-close {
      position: absolute;
      top: 18px;
      right: 22px;
      width: 58px;
      height: 58px;
      background: transparent;
      color: #333;
      font-size: 56px;
      line-height: 1;
      display: grid;
      place-items: center;
      border-radius: 999px;
      z-index: 10;
    }

    .barcode-page-bottom-close {
      width: 100%;
      margin-top: 48px;
      border-radius: 14px;
      padding: 16px;
      background: #111;
      color: #fff;
      font-weight: 900;
      font-size: 22px;
    }

    .verify-page,
    .staff-page {
      min-height: 100vh;
      background: linear-gradient(140deg, #1e1e1e, #504637);
      padding: 40px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .verify-card,
    .staff-card {
      width: min(460px, 100%);
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
    }

    .verify-card h1,
    .staff-card h1 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #d7d7d7;
      border-radius: 12px;
      padding: 14px;
      margin: 8px 0;
      background: #fff;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .verify-card button,
    .staff-card button {
      width: 100%;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      background: #111;
      color: white;
      font-weight: 900;
    }

    .verify-card button:disabled {
      background: #aaa;
    }

    .debug-code {
      background: #fff8ca;
      color: #5d4a00;
      padding: 10px;
      border-radius: 10px;
      margin: 8px 0;
    }

    .message {
      margin-top: 12px;
      color: #78410d;
      font-weight: 700;
      white-space: pre-wrap;
    }

    .member-result {
      margin-top: 14px;
      background: #f5f5f5;
      border-radius: 14px;
      padding: 14px;
    }

    @media (min-width: 780px) {

      .modal-mask {
        align-items: center;
        justify-content: center;
      }

      .modal-card {
        max-width: 480px;
        border-radius: 22px;
      }
    }

    .coupon-info-label {

    .coupon-info-value {

      color: #06b84f;

    .coupon-action-btn {

      padding: 14px;

    }

    .record-list {
      display: grid;

    }

    .record-card {
      background: #fff;

      font-size: 20px;

    }

      font-weight: 900;
    }

    .record-code {
      font-size: 12px;
      color: #9aa1a4;
      word-break: break-all;
      margin-top: 4px;
    }

    function saveMemberCache() {

      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;

        const data = JSON.parse(raw);

        if (!data || !data.member) return null;

        // 快取最多保留 12 小時
        if (Date.now() - Number(data.savedAt || 0) > 12 * 60 * 60 * 1000) {
          return null;

        return data;

        return null;
      }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }


    function encodeUrlValue(value) {
      return encodeURIComponent(String(value ?? ''));
    }

    function formatSimpleDateTime(value) {
      const raw = String(value ?? '').trim();

      if (!raw) return '';

      let d = null;

      // ISO 格式：2026-07-09T06:48:43.000Z
      if (raw.includes('T')) {
        const parsed = new Date(raw);

        if (!Number.isNaN(parsed.getTime())) {
          d = parsed;
        }
      }

      // 一般格式：2026/07/09 18:00:00 或 2026-07-09 18:00:00
      if (!d) {
        const normalized = raw.replace(/-/g, '/');
        const parsed = new Date(normalized);

        if (!Number.isNaN(parsed.getTime())) {
          d = parsed;
        }
      }

      if (!d) {
        return raw
          .replace(/-/g, '/')
          .replace('T', ' ')
          .replace('.000Z', '')
          .slice(0, 16);
      }

      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');

      return `${y}/${m}/${day} ${hh}:${mm}`;
    }

    function formatSimpleDate(value) {
      const text = formatSimpleDateTime(value);

      if (!text) return '';

      return text.split(' ')[0];
    }


    async function post(action, payload = {}) {
      if (!GAS_API_URL || GAS_API_URL.includes('你的')) {
        throw new Error('尚未設定 GAS_API_URL');
      }

      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify({
          action,
          ...payload,
        }),
      });

      const json = await res.json();

      if (!json.success) {
        throw new Error(json.message || 'API 發生錯誤');
      }

      return json.data;
    }

    async function initLineLogin() {
      if (!LIFF_ID || LIFF_ID.includes('你的')) {
        throw new Error('尚未設定 LIFF_ID');
      }

      await liff.init({
        liffId: LIFF_ID,
      });

      if (!liff.isLoggedIn()) {
        liff.login({
          redirectUri: window.location.href,
        });
        return null;
      }

      const profile = await liff.getProfile();
      const idToken = liff.getIDToken();

      if (!idToken) {
        throw new Error('無法取得 LINE ID Token，請確認 LIFF scope 有 openid/profile');
      }

      return {
        profile,
        idToken,
      };
    }

      Object.assign(state, patch);
      render();

    function render() {

      if (state.registrationInProgress) {

      const phoneVerified =
        state.member.phoneVerified === true ||
        state.member.phoneVerified === 'true';

      if (!phoneVerified) {
        renderVerifyPhone();
        return;
      }

      renderHomePage();
    }

    function renderVerifyPhone() {
      app.className = '';
      app.innerHTML = `
        <div class="verify-page">
          <div class="verify-card">
            <h1>會員註冊</h1>
            <p>請輸入手機號碼，送出後即可完成會員註冊。</p>

            <input
              id="phoneInput"
              placeholder="手機號碼，例如 0912345678"
              inputmode="tel"
              autocomplete="tel"
            />

            <button id="bindPhoneBtn" type="button">
              送出註冊
            </button>

            <div id="verifyMsg" class="message"></div>
          </div>
        </div>
      `;

      document.getElementById('bindPhoneBtn').onclick = async () => {
        const phoneInput =
          document.getElementById('phoneInput');

        const phone = String(
          phoneInput?.value || ''
        ).replace(/[^0-9]/g, '');

        const msg =
          document.getElementById('verifyMsg');

        if (!/^09\d{8}$/.test(phone)) {
          msg.textContent =
            '請輸入正確的手機號碼，例如 0912345678';
          msg.classList.add('show');
          return;
        }

        // 先鎖住所有背景 render，避免舊的 getHomeData
        // 把「註冊中」重新覆蓋成手機輸入畫面。

              const member =
                homeData?.member || null;

              const phoneVerified =
                member?.phoneVerified === true ||
                String(
                  member?.phoneVerified || ''
                ).trim().toLowerCase() === 'true';

              const savedPhone =
                String(
                  member?.phone || ''
                ).replace(/[^0-9]/g, '');

              // 必須同時確認：
              // 1. phoneVerified 已為 true
              // 2. 後台手機號碼與本次輸入相同
              if (
                member &&
                phoneVerified &&
                savedPhone === phone
              ) {
                confirmedHomeData = homeData;
                break;
              }

              if (waitingText) {
                waitingText.textContent =
                  attempt < 8
                    ? '資料同步中，請稍候'
                    : '仍在確認資料，請不要關閉頁面';
              }
            } catch (error) {
              lastError = error;

              console.warn(
                '會員註冊確認第 ' +
                  attempt +
                  ' 次失敗',
                error
              );

              if (waitingText) {
                waitingText.textContent =
                  '連線同步中，正在自動重試';
              }
            }

            await new Promise((resolve) => {
              window.setTimeout(
                resolve,
                intervalMs
              );
            });
          }

          if (!confirmedHomeData?.member) {
            throw new Error(
              lastError?.message ||
              '會員資料尚未完成同步，請稍後重新開啟頁面'
            );
          }

          // 僅在後端確定 phoneVerified=true 後才結束等待。
          state.member =
            confirmedHomeData.member;

          state.activities =
            Array.isArray(
              confirmedHomeData.activities
            )
              ? confirmedHomeData.activities
              : [];

          state.coupons =
            Array.isArray(
              confirmedHomeData.coupons
            )
              ? confirmedHomeData.coupons
              : [];

          state.couponUseLogs =
            Array.isArray(
              confirmedHomeData.couponUseLogs
            )
              ? confirmedHomeData.couponUseLogs
              : [];

          state.walletLogs =
            Array.isArray(
              confirmedHomeData.walletLogs
            )
              ? confirmedHomeData.walletLogs
              : [];

          state.loading = false;
          state.error = '';

          saveMemberCache();

          // 後端已確認手機與 phoneVerified=true，
          // 此時才解除鎖並進入會員首頁。
          state.registrationInProgress = false;
          renderHomePage();
        } catch (err) {
          console.error(
            '會員註冊確認失敗',
            err
          );

          // 已結束本次註冊確認流程，才允許畫面再次操作。
          state.registrationInProgress = false;

          app.className = '';
          app.innerHTML = `
            <div class="verify-page">
              <div
                class="verify-card"
                style="text-align:center;"

          `;

          const continueBtn =

          if (continueBtn) {

              // 不要求重新輸入手機。

        state.forceRefreshing ||
        state.registrationInProgress ||
        state.couponActionLoading ||

      if (state.refreshing) {

      const currentTab = state.tab || 'coupon';

      const currentTab = state.tab || 'coupon';

      state.forceRefreshing = true;
      state.refreshing = true;

      const startedAt = Date.now();

      try {
        const homeData = await post('getHomeData', {
          idToken: state.idToken,

        state.activities = homeData.activities || [];

        }

        state.lastRefreshedAt = Date.now();

        state.tab = currentTab;

        saveMemberCache();

        const elapsed = Date.now() - startedAt;

          state.forceRefreshing = false;

          syncTabButtons();
          renderContent();

        const wait = Math.max(0, 650 - elapsed);

        window.setTimeout(() => {
          state.forceRefreshing = false;
          state.refreshing = false;
          setFrontRefreshButton(false);

    async function ensureFrontLineIdToken() {
      if (state.idToken) {
        return state.idToken;
      }

      if (typeof liff === 'undefined') {
        throw new Error('LINE LIFF 尚未載入完成，請稍後再試');
      }

      await liff.init({
        liffId: LIFF_ID,
      });

      if (!liff.isLoggedIn()) {
        liff.login({
          redirectUri: window.location.href,
        });

        throw new Error('正在重新登入 LINE，請稍後再操作');
      }

      let idToken = liff.getIDToken();

      if (!idToken) {
        const auth = await initLineLogin();

        if (auth && auth.idToken) {
          idToken = auth.idToken;
          state.profile = auth.profile || state.profile;
        }
      }

      if (!idToken) {
        throw new Error('無法取得 LINE ID Token，請關閉頁面後重新開啟');
      }

      state.idToken = idToken;

      return idToken;
    }


    // ===== 優惠券顯示與樂觀更新修正 =====

    function waitMs(ms) {
      return new Promise((resolve) => {
        window.setTimeout(resolve, Number(ms) || 0);
      });
    }

    function getCouponIdentity(coupon) {
      if (!coupon || typeof coupon !== 'object') {
        return '';
      }

      return String(
        coupon.memberCouponId ??
        coupon.id ??
        coupon.couponId ??
        coupon.code ??
        coupon.ticketId ??
        ''
      ).trim();
    }

    function getCouponStatus(coupon) {
      const rawStatus = String(
        coupon?.status ??
        coupon?.couponStatus ??
        ''
      ).trim().toLowerCase();

      if (
        coupon?.used === true ||
        coupon?.isUsed === true ||
        rawStatus === 'used' ||
        rawStatus === 'redeemed'
      ) {
        return 'used';
      }

      if (
        coupon?.claimed === true ||
        coupon?.isClaimed === true ||
        rawStatus === 'available' ||
        rawStatus === 'claimed' ||
        rawStatus === 'unused'
      ) {
        return 'available';
      }

      return 'unclaimed';
    }

    function getCouponSortTime(coupon) {
      const values = [
        coupon?.optimisticUpdatedAt,
        coupon?.claimedAt,
        coupon?.createdAt,
        coupon?.updatedAt,
        coupon?.startAt,
        coupon?.startDate
      ];

      for (const value of values) {
        if (!value) {
          continue;
        }

        if (typeof value === 'number' && Number.isFinite(value)) {
          return value;
        }

        const timestamp = new Date(value).getTime();

        if (!Number.isNaN(timestamp)) {
          return timestamp;
        }
      }

      return 0;
    }

    function sortCouponsForDisplay(coupons) {
      const statusOrder = {
        available: 0,
        claimed: 0,
        unused: 0,
        unclaimed: 1,
        used: 2,
        redeemed: 2
      };

      return [...(Array.isArray(coupons) ? coupons : [])].sort((a, b) => {
        const aStatus = getCouponStatus(a);
        const bStatus = getCouponStatus(b);

        const aOrder = statusOrder[aStatus] ?? 1;
        const bOrder = statusOrder[bStatus] ?? 1;

        if (aOrder !== bOrder) {
          return aOrder - bOrder;
        }

        return getCouponSortTime(b) - getCouponSortTime(a);
      });
    }

    function createOptimisticCouponUseLog(coupon) {
      const memberCouponId = getCouponIdentity(coupon);
      const now = new Date().toISOString();

      return {
        id: 'optimistic-' + memberCouponId + '-' + Date.now(),
        memberCouponId,
        couponId: coupon?.couponId ?? coupon?.id ?? '',
        title:
          coupon?.title ??
          coupon?.couponTitle ??
          coupon?.name ??
          '優惠券',
        description:
          coupon?.description ??
          coupon?.content ??
          '',
        imageUrl:
          coupon?.imageUrl ??
          coupon?.image ??
          '',
        amount:
          coupon?.amount ??
          coupon?.discountAmount ??
          coupon?.value ??
          '',
        usedAt: now,
        createdAt: now,
        status: 'used',
        optimistic: true
      };
    }

    async function reconcileHomeDataInBackground(targetTab, options = {}) {
      const retryCount = Number(options.retryCount ?? 3);
      const retryDelay = Number(options.retryDelay ?? 900);

      let lastError = null;

      for (let attempt = 0; attempt < retryCount; attempt += 1) {
        try {
          const idToken = await ensureFrontLineIdToken();

          const homeData = await post('getHomeData', {
            idToken
          });

          applyHomeDataToState(homeData);

          if (targetTab) {
            state.tab = targetTab;
          }

          if (
            !state.loading &&
            state.member &&
            document.getElementById('content')
          ) {
            syncTabButtons();
            renderContent();
          }

          return homeData;
        } catch (err) {
          lastError = err;
          console.warn(
            'reconcileHomeDataInBackground failed',
            attempt + 1,
            err
          );

          if (attempt < retryCount - 1) {
            await waitMs(retryDelay * (attempt + 1));
          }
        }
      }

      throw lastError || new Error('優惠券資料同步失敗');
    }

    async function claimCoupon(memberCouponId) {
      if (state.couponActionLoading) {
        return;
      }

      const couponIndex = (state.coupons || []).findIndex((coupon) => {
        return getCouponIdentity(coupon) === String(memberCouponId);
      });

      const originalCoupons = (state.coupons || []).map((coupon) => ({
        ...coupon,
      }));

      const btn = document.querySelector(
        `[data-claim-coupon="${memberCouponId}"]`
      );

      try {
        state.couponActionLoading = true;

        if (btn) {
          btn.disabled = true;
          btn.classList.add('is-loading');
          btn.textContent = '領取中...';
        }

        setFrontActionLoading('優惠券領取中...');

        // 讓使用者看得到短暫的處理狀態
        await waitMs(350);

        // 先更新前台畫面：未領取 → 已領取
        if (couponIndex >= 0) {
          state.coupons[couponIndex] = {
            ...state.coupons[couponIndex],
            status: 'available',
            claimedAt: new Date().toISOString(),
            optimisticUpdatedAt: Date.now(),
          };

          state.coupons = sortCouponsForDisplay(state.coupons);
        }

        state.tab = 'coupon';
        saveMemberCache();
        renderHomePage();

        // 標記這張券正在背景領取
        state.optimisticCouponIds[String(memberCouponId)] = 'claiming';

        const claimTask = (async () => {
          const idToken = await ensureFrontLineIdToken();

          await post('claimMemberCoupon', {
            idToken,
            memberCouponId,
          });

          state.optimisticCouponIds[String(memberCouponId)] = 'claimed';

          return true;
        })();

        state.couponPendingTasks[String(memberCouponId)] = claimTask;

        // 等待背景任務，但不影響已經更新完成的畫面
        await claimTask;

        delete state.couponPendingTasks[String(memberCouponId)];

        reconcileHomeDataInBackground({
          preferredTab: state.tab,
          attempts: 4,
        });
      } catch (err) {
        console.error('claimCoupon failed', err);

        delete state.couponPendingTasks[String(memberCouponId)];
        delete state.optimisticCouponIds[String(memberCouponId)];

        // 後端失敗才還原
        state.coupons = originalCoupons;
        state.tab = 'coupon';
        saveMemberCache();
        renderHomePage();

        alert(err.message || String(err));
      } finally {
        state.couponActionLoading = false;
      }
    }


    async function useCoupon(memberCouponId) {
      if (state.couponActionLoading) {
        return;
      }

      const coupon = (state.coupons || []).find((item) => {
        return getCouponIdentity(item) === String(memberCouponId);
      });

      const originalCoupons = (state.coupons || []).map((item) => ({
        ...item,
      }));

      const originalUseLogs = (state.couponUseLogs || []).map((item) => ({
        ...item,
      }));

      const ok = confirm(
        '確定要使用這張優惠券嗎？使用後會移到使用紀錄。'
      );

      if (!ok) {
        return;
      }

      const btn = document.querySelector(
        `[data-use-coupon="${memberCouponId}"]`
      );

      try {
        state.couponActionLoading = true;

        if (btn) {
          btn.disabled = true;
          btn.classList.add('is-loading');
          btn.textContent = '使用中...';
        }

        setFrontActionLoading('優惠券使用中...');

        await waitMs(350);

        // 先從可用優惠券移除
        state.coupons = (state.coupons || []).filter((item) => {
          return getCouponIdentity(item) !== String(memberCouponId);
        });

        // 先新增一筆前台使用紀錄，排在最上面
        if (coupon) {
          const optimisticLog = createOptimisticCouponUseLog(coupon);

          state.couponUseLogs = [
            optimisticLog,
            ...(state.couponUseLogs || []).filter((log) => {
              return String(log.memberCouponId || '') !==
                String(memberCouponId);
            }),
          ];
        }

        state.tab = 'couponHistory';
        saveMemberCache();
        renderHomePage();

        const couponKey = String(memberCouponId);
        state.optimisticCouponIds[couponKey] = 'using';

        const useTask = (async () => {
          // 若這張券剛剛才領取，先等待領取後端完成
          const pendingClaim = state.couponPendingTasks[couponKey];

          if (pendingClaim) {
            await pendingClaim;
          }

          const idToken = await ensureFrontLineIdToken();

          await post('useOwnMemberCoupon', {
            idToken,
            memberCouponId,
          });

          state.optimisticCouponIds[couponKey] = 'used';

          return true;
        })();

        state.couponPendingTasks[couponKey] = useTask;

        // 畫面已在使用紀錄，這裡讓後端繼續完成
        await useTask;

        delete state.couponPendingTasks[couponKey];

        reconcileHomeDataInBackground({
          preferredTab: 'couponHistory',
          attempts: 4,
        });
      } catch (err) {
        console.error('useCoupon failed', err);

        delete state.couponPendingTasks[String(memberCouponId)];
        delete state.optimisticCouponIds[String(memberCouponId)];

        // 失敗才還原優惠券與使用紀錄
        state.coupons = originalCoupons;
        state.couponUseLogs = originalUseLogs;
        state.tab = 'coupon';
        saveMemberCache();
        renderHomePage();

        alert(err.message || String(err));
      } finally {
        state.couponActionLoading = false;
      }
    }

    function renderCouponCard(c) {
      const isUnclaimed = String(c.status) === 'unclaimed';
      const amountText = c.couponAmount ? `折抵 ${escapeHtml(c.couponAmount)} 元` : '會員優惠';
      const statusText = isUnclaimed ? '未領取' : '已領取';

      return `
        <div class="coupon-native-card">
          <div class="coupon-native-img">
            ${c.imageUrl ? `<img src="${escapeHtml(c.imageUrl)}" alt="${escapeHtml(c.title || '優惠券')}">` : `<div class="coupon-native-placeholder">COUPON</div>`}
          </div>

          <div class="coupon-native-body">
            <div class="coupon-status-pill ${isUnclaimed ? 'unclaimed' : 'claimed'}">
              ${statusText}
            </div>

            <h3 class="coupon-native-title">${escapeHtml(c.title || '解憂藥局優惠券')}</h3>
            <p class="coupon-native-desc">${escapeHtml(c.description || '可於有效期限內使用。')}</p>

            <div class="coupon-info-grid">
              <div class="coupon-info-box">
                <div class="coupon-info-label">折抵金額</div>
                <div class="coupon-info-value green">${amountText}</div>
              </div>

              <div class="coupon-info-box">
                <div class="coupon-info-label">使用期限</div>
                <div class="coupon-info-value">${escapeHtml(formatSimpleDate(c.expiredAt) || '未設定')}</div>
              </div>
            </div>

            ${isUnclaimed ? `
              <button
                class="coupon-action-btn claim"
                type="button"
                data-claim-coupon="${escapeHtml(c.memberCouponId || c.id)}"
                onclick="claimCoupon('${escapeHtml(c.memberCouponId || c.id)}')"
              >
                領取優惠券
              </button>
            ` : `
              <button
                class="coupon-action-btn"
                type="button"
                data-use-coupon="${escapeHtml(c.memberCouponId || c.id)}"
                onclick="useCoupon('${escapeHtml(c.memberCouponId || c.id)}')"
              >
                使用該券
              </button>

              <div class="coupon-code-box">
                券號：${escapeHtml(c.memberCouponId || c.id || '')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function parseRecordTime(value) {
      const raw = String(value || '').trim();

      if (!raw) {
        return 0;
      }

      // 支援：
      // 2026/7/13 00:59
      // 2026/07/13 00:59:00
      // 2026-07-13T00:59:00.000Z
      // Date 物件
      const d1 = new Date(raw);

      if (!Number.isNaN(d1.getTime())) {
        return d1.getTime();
      }

      const normalized = raw
        .replace(/-/g, '/')
        .replace('T', ' ')
        .replace('.000Z', '')
        .trim();

      const d2 = new Date(normalized);

      if (!Number.isNaN(d2.getTime())) {
        return d2.getTime();
      }

      return 0;
    }

    function sortRecordsNewestFirst(list, timeKey) {
      return [...(list || [])].sort((a, b) => {
        const bt = parseRecordTime(b && b[timeKey]);
        const at = parseRecordTime(a && a[timeKey]);

        if (bt !== at) {
          return bt - at;
        }

        // 時間一樣時，用 id 做第二排序，避免順序跳動
        return String(b.logId || b.id || '').localeCompare(String(a.logId || a.id || ''));
      });
    }

    function renderContent() {
      const content = document.getElementById('content');

      if (state.tab === 'coupon') {
        const sortedCoupons = sortCouponsForDisplay(
          state.coupons || []
        );

        const claimed = sortedCoupons.filter((c) => {
          const status = String(c.status || '');

          return status === 'available' || status === 'claimed';
        });

        const unclaimed = sortedCoupons.filter((c) => {
          return String(c.status || '') === 'unclaimed';
        });

        if (!unclaimed.length && !claimed.length) {
          content.innerHTML = `
            <div class="empty">
              <h2>優惠券</h2>
              <p>目前沒有可用優惠券。</p>
            </div>
          `;
          return;
        }

        content.innerHTML = `
          <div class="list">
            ${claimed.length ? `
              <div class="coupon-section-title">已領取</div>
              ${claimed.map(renderCouponCard).join('')}
            ` : ''}

            ${unclaimed.length ? `
              <div class="coupon-section-title">未領取</div>
              ${unclaimed.map(renderCouponCard).join('')}
            ` : ''}
          </div>
        `;
        return;
      }

      if (state.tab === 'couponHistory') {
        const logs = sortRecordsNewestFirst(state.couponUseLogs || [], 'usedAt');

        if (!logs.length) {
          content.innerHTML = `
            <div class="empty">
              <h2>優惠券使用紀錄</h2>
              <p>目前尚無使用紀錄。</p>
            </div>
          `;
          return;
        }

        content.innerHTML = `
          <div class="record-list">
            ${logs.map((log) => {
              const amountText = log.couponAmount ? `折抵 ${escapeHtml(log.couponAmount)} 元` : '優惠券';
              const usedAtText = formatSimpleDateTime(log.usedAt);

              return `
                <div class="record-card coupon-used-record">
                  <div class="record-title">${escapeHtml(log.title || '優惠券')}</div>

                  <div class="used-coupon-amount">${amountText}</div>

                  <div class="record-meta">使用時間：${escapeHtml(usedAtText || '未記錄')}</div>

                  <div class="record-meta record-code">
                    券號：${escapeHtml(log.memberCouponId || '')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        return;
      }

      if (state.tab === 'wallet') {
        const logs = sortRecordsNewestFirst(state.walletLogs || [], 'createdAt');

        if (!logs.length) {
          content.innerHTML = `
            <div class="empty">
              <h2>儲值紀錄</h2>
              <p>目前尚無儲值紀錄。</p>
            </div>
          `;
          return;
        }

        content.innerHTML = `
          <div class="record-list">
            ${logs.map((log) => {
              const amount = Number(log.amount || 0);

              const timeText = formatSimpleDateTime(log.createdAt) || '未記錄時間';
              const methodText = log.payMethod || '未設定';
              const noteText = log.note || '無備註';

              return `
                <div class="record-card wallet-record-card">
                  <div class="wallet-record-main">
                    <div class="wallet-record-type">
                      <span class="wallet-record-dot ${amount < 0 ? 'negative' : ''}"></span>
                      <span>${escapeHtml(log.type || '儲值紀錄')}</span>
                    </div>

                    <div class="wallet-record-amount ${amount < 0 ? 'negative' : ''}">
                      ${amount >= 0 ? '+' : '-'}$${escapeHtml(Math.abs(amount))}
                    </div>
                  </div>

                  <div class="wallet-record-sub">
                    <span>${escapeHtml(timeText)}</span>
                    <span>｜</span>
                    <span class="wallet-record-method">${escapeHtml(methodText)}</span>
                  </div>

                  <div class="wallet-record-note ${log.note ? '' : 'is-empty'}">
                    備註：${escapeHtml(noteText)}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
    }


    function renderStaffScanPage() {
      app.className = '';
      app.innerHTML = `
        <div class="staff-page">
          <div class="staff-card">
            <h1>解憂藥局｜店家掃碼加點</h1>

            <input id="staffPin" placeholder="店員 PIN" />
            <input id="barcodeValue" placeholder="掃描或貼上會員條碼" />

            <button id="findMemberBtn" type="button">查詢會員</button>

            <div id="memberResult"></div>

            <div id="staffMsg" class="message"></div>
          </div>
        </div>
      `;

      document.getElementById('findMemberBtn').onclick = async () => {
        const staffPin = document.getElementById('staffPin').value.trim();
        const barcodeValue = document.getElementById('barcodeValue').value.trim();
        const msg = document.getElementById('staffMsg');
        const result = document.getElementById('memberResult');

        msg.textContent = '';
        result.innerHTML = '';

        try {
          const data = await post('staffFindMember', {
            staffPin,
            barcodeValue,
          });

          const m = data.member;

          result.innerHTML = `
            <div class="member-result">
              <b>${escapeHtml(m.displayName)}</b>
              <p>會員編號：${escapeHtml(m.memberId)}</p>
              <p>目前點數：${escapeHtml(m.points)}</p>

              <input id="pointsInput" type="number" value="1" />
              <input id="noteInput" placeholder="備註，例如消費加點" />

              <button id="addPointsBtn" type="button">確認累積點數</button>
            </div>
          `;

          document.getElementById('addPointsBtn').onclick = async () => {
            const points = Number(document.getElementById('pointsInput').value || 0);
            const note = document.getElementById('noteInput').value.trim();

            msg.textContent = '';

            try {
              const updated = await post('staffAddPoints', {
                staffPin,
                barcodeValue,
                points,
                note,
              });

              msg.textContent =
                '已完成點數更新\n目前點數：' + updated.member.points;
            } catch (err) {
              msg.textContent = err.message || String(err);
            }
          };
        } catch (err) {
          msg.textContent = err.message || String(err);
        }
      };
    }

    function renderAdminPage() {
      app.className = '';
      app.innerHTML = `
        <div class="staff-page">
          <div class="staff-card">
            <h1>解憂藥局｜簡易管理後台</h1>

            <input id="adminPin" placeholder="管理 PIN" />
            <input id="activityTitle" placeholder="活動標題" />
            <input id="activityImageUrl" placeholder="活動圖片網址" />
            <textarea id="activityContent" placeholder="活動內容"></textarea>
            <input id="activityEndAt" placeholder="到期日，例如 2026/7/31" />

            <button id="createActivityBtn" type="button">新增活動</button>

            <div id="adminMsg" class="message"></div>
          </div>
        </div>
      `;

      document.getElementById('createActivityBtn').onclick = async () => {
        const msg = document.getElementById('adminMsg');

        msg.textContent = '';

        try {
          await post('adminCreateActivity', {
            adminPin: document.getElementById('adminPin').value.trim(),
            title: document.getElementById('activityTitle').value.trim(),
            imageUrl: document.getElementById('activityImageUrl').value.trim(),
            content: document.getElementById('activityContent').value.trim(),
            endAt: document.getElementById('activityEndAt').value.trim(),
          });

          document.getElementById('activityTitle').value = '';
          document.getElementById('activityImageUrl').value = '';
          document.getElementById('activityContent').value = '';
          document.getElementById('activityEndAt').value = '';

          msg.textContent = '活動已新增';
        } catch (err) {
          msg.textContent = err.message || String(err);
        }
      };
    }

    async function boot() {
      const path = window.location.pathname;

      if (path.endsWith('/pos-scan') || path.includes('/pos-scan')) {
        renderStaffScanPage();
        return;
      }

      if (path.endsWith('/admin') || path.includes('/admin')) {
        renderAdminPage();
        return;
      }

      const cached = readMemberCache();

      if (cached && cached.member) {
        state.loading = false;
        state.error = '';
        state.member = cached.member;
        state.activities = cached.activities || [];
        state.coupons = cached.coupons || [];
        state.couponUseLogs = cached.couponUseLogs || [];
        state.walletLogs = cached.walletLogs || [];
        render();
      }

      try {
        const auth = await initLineLogin();

        if (!auth) {
          return;
        }

        const bootData = await post('bootstrapMember', {
          idToken: auth.idToken,
          profile: auth.profile,
        });

        state.loading = false;
        state.error = '';
        state.idToken = auth.idToken;
        state.profile = auth.profile;
        state.member = bootData.member;
        state.activities = state.activities || [];
        state.coupons = state.coupons || [];
        state.couponUseLogs = state.couponUseLogs || [];
        state.walletLogs = state.walletLogs || [];

        render();
        saveMemberCache();

        post('getHomeData', {
          idToken: auth.idToken,
        })
          .then(function (homeData) {
            // 這個請求可能在使用者送出註冊前就已發出。
            // 註冊中時不得用舊的 phoneVerified=false 覆蓋狀態。
            if (state.registrationInProgress) {
              console.warn(
                '忽略註冊期間返回的舊 getHomeData 資料'
              );
              return;
            }

            state.member = homeData.member || bootData.member;
            state.activities = homeData.activities || [];
            state.coupons = homeData.coupons || [];
            state.couponUseLogs = homeData.couponUseLogs || [];
            state.walletLogs = homeData.walletLogs || [];
            state.lastRefreshedAt = Date.now();
            saveMemberCache();
            render();
          })
          .catch(function (err) {
            console.warn('背景載入活動 / 禮券失敗：', err);
          });
      } catch (err) {
        if (cached && cached.member) {
          console.warn('背景更新會員資料失敗，但已使用快取：', err);
          return;
        }

        setState({
          loading: false,
          error: err.message || String(err),
        });
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        refreshMemberData({ silent: true });
      }
    });

    window.addEventListener('focus', () => {
      refreshMemberData({ silent: true });
    });

    setInterval(() => {
      if (!document.hidden && state.member && state.idToken) {
        refreshMemberData({ silent: true });
      }
    }, 15000);


    // frontRefreshBtn clicked by delegation
    document.addEventListener('click', function (event) {
      const btn = event.target.closest && event.target.closest('#frontRefreshBtn');

      if (!btn) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();

      refreshFrontHomeData();
    });

    boot();
  </script>
